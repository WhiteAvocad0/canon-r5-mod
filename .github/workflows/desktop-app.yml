name: desktop-app

# Builds the unsigned R5 Mod Assistant desktop app with packaging/build_app.py: a .dmg
# for macOS (Apple Silicon and Intel) and a .zip for Windows (x64). Each job runs the
# app's --self-test from the built app (on Windows from the unzipped .zip).
# The package includes the pinned host toolchain. Its compiler smoke test uses a small standalone fixture and requires
# no Canon ROM. Installer artifacts (manual runs) and a tag app-v<version> (matching tools/gui/bundle.py VERSION), which
# publishes them as a GitHub prerelease, come with both toolchain source packages pinned in packaging/build_app.py
# (--print-toolchain-source): Arm's 15.2.Rel1 source package, whose pin must also equal the SHA-256 Arm publishes, and the
# xPack corresponding-source companion from the toolchain-src-xpack-15.2.1-1.1 release. Each is checked before upload.

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "tools/**"
      - ".github/workflows/desktop-app.yml"

permissions:
  contents: read

jobs:
  toolchain-source:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.sources.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and fetch the toolchain source packages
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          fetch() { curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --silent --show-error "$@"; }
          python3 packaging/build_app.py --print-toolchain-source > sources.txt
          read -r name url sha256 < sources.txt  # Arm's package comes first
          read -r published published_name < <(fetch "$url.sha256asc")
          if [[ "$published" != "$sha256" || "${published_name#\*}" != "$name" ]]; then
            echo "::error::Arm publishes $published for $published_name; packaging/build_app.py pins $sha256 for $name"
            exit 1
          fi
          echo "Arm's published SHA-256 for $name matches the pin."
          if [[ "$GITHUB_REF" != refs/tags/app-v* && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "Build and test only. Installer uploads come with both toolchain source packages."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir sources
          while read -r name url sha256; do
            fetch --output "sources/$name" "$url"
            (cd sources && echo "$sha256  $name" | sha256sum --check)
            tar -tf "sources/$name" > /dev/null
          done < sources.txt
          ls -l sources
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sources.outputs.available == 'true'
        with:
          name: toolchain-sources
          path: sources/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  app:
    needs: toolchain-source
    name: app (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            os: macos
            arch: arm64
            machine: arm64
          - runner: macos-15-intel # GitHub's last x86_64 macOS image (announced until fall 2027)
            os: macos
            arch: x86_64
            machine: x86_64
          - runner: windows-latest
            os: windows
            arch: x64
            machine: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: test "app-v$(python packaging/build_app.py --print-version)" = "$GITHUB_REF_NAME"
      - name: Check the architecture and Tkinter
        run: |
          test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
          python -c 'import tkinter; print("Tk", tkinter.TkVersion)'
      - name: Install PyInstaller
        run: python -m pip install -r packaging/requirements.txt
      - name: Build the app, package it and run its self-test
        run: python packaging/build_app.py --self-test
      - name: Point installer recipients to the matching compiler sources
        if: needs.toolchain-source.outputs.available == 'true'
        run: |
          {
            echo "Source code of the bundled xPack GNU Arm Embedded GCC 15.2.1-1.1"
            echo "(also in this run's toolchain-sources artifact and attached to app-v releases):"
            python packaging/build_app.py --print-toolchain-source | while read -r name url sha256; do
              printf '\n%s\n%s\nSHA-256: %s\n' "$name" "$url" "$sha256"
            done
          } > build/desktop-app/COMPILER-SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: needs.toolchain-source.outputs.available == 'true'
        with:
          compression-level: 0
          name: R5-Mod-Assistant-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/desktop-app/*.dmg
            build/desktop-app/*.zip
            build/desktop-app/COMPILER-SOURCE.txt
          if-no-files-found: error

  prerelease:
    needs: [app, toolchain-source]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the packages as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum ./*.dmg ./*.zip ./*.tar ./*.tar.xz > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          Unsigned desktop build of R5 Mod Assistant (prototype, untested). macOS: the `arm64` .dmg for Apple Silicon, `x86_64` for Intel Macs. Windows: the `windows-x64` .zip.

          The app is not signed. On macOS, click **Open Anyway** in System Settings > Privacy & Security after the first try (macOS 14 and earlier: Control-click > **Open**). On Windows, extract the whole .zip, and if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**. See [docs/gui.md](https://github.com/WhiteAvocad0/canon-r5-mod/blob/main/docs/gui.md#download-the-app).

          **Bundled compiler:** xPack GNU Arm Embedded GCC 15.2.1-1.1 (GCC 15.2.1, Binutils 2.45, Newlib 4.5.0, GDB 16.3), unmodified: every file of xPack's official archive for each host is included byte for byte, and the app adds only licence notices. xPack builds it from Arm GNU Toolchain 15.2.Rel1 sources. Step 5 checks it automatically. GCC, Binutils and GDB are licensed under the GNU GPL version 3 or later, with the GCC Runtime Library Exception for the runtime libraries; each component's licence is in the package's `Licenses/GNU Arm toolchain` folder and inside the app.

          **Source code:** `arm-gnu-toolchain-src-snapshot-15.2.rel1.tar.xz` below is Arm's source package for 15.2.Rel1 (checked against the SHA-256 Arm publishes). `xpack-15.2.1-1.1-corresponding-source.tar` holds xPack's build scripts and patches and every other source input, with a MANIFEST; it is also kept on the `toolchain-src-xpack-15.2.1-1.1` release. The Windows package also contains Microsoft's `vcruntime140.dll` and `vcruntime140_1.dll`, Visual C++ redistributable files distributed under the Visual Studio redistribution terms.

          Supply your own camera’s ROM dump. Preparing a card's boot markers is offered on macOS only; on Windows, copy `autoexec.bin` to a card prepared on a Mac. Every build the app makes is a public repackaged build and is hardware-untested.
          EOF
          gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.zip ./*.tar ./*.tar.xz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --prerelease \
            --verify-tag --title "R5 Mod Assistant ${GITHUB_REF_NAME#app-v} for macOS and Windows (unsigned prerelease)" --notes-file notes.md
