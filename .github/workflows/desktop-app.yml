name: desktop-app

# Builds the unsigned R5 Mod Assistant desktop app with packaging/build_app.py: a .dmg
# for macOS (Apple Silicon and Intel) and a .zip for Windows (x64). Each job runs the
# app's --self-test from the built app (on Windows from the unzipped .zip).
# Installer artifacts are shared alongside their reviewed compiler source companion. A tag app-v<version> (matching tools/gui/bundle.py VERSION)
# also publishes them as a GitHub prerelease. The package includes the pinned host toolchain. Its compiler smoke test uses
# a small standalone fixture and requires no Canon ROM. Every app-v release also attaches Arm's source package for the
# toolchain's Arm GNU Toolchain release (packaging/build_app.py --print-toolchain-source), checked against the SHA-256
# that Arm publishes beside it.

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "tools/**"
      - ".github/workflows/desktop-app.yml"

permissions:
  contents: read

jobs:
  compiler-source:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.source.outputs.available }}
    steps:
      - name: Verify the publisher's matching compiler source archive
        id: source
        env:
          SOURCE_URL: ${{ vars.XPACK_15_2_1_1_1_SOURCE_URL }}
          SOURCE_SHA256: ${{ vars.XPACK_15_2_1_1_1_SOURCE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_URL" && -z "$SOURCE_SHA256" && "$GITHUB_REF" != refs/tags/app-v* ]]; then
            echo "Build and test only. Installer uploads require the reviewed compiler source companion."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SOURCE_URL" != https://* || ! "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure XPACK_15_2_1_1_1_SOURCE_URL and XPACK_15_2_1_1_1_SOURCE_SHA256 for the reviewed xPack 15.2.1-1.1 corresponding-source tar.gz. See THIRD_PARTY_NOTICES.md."
            exit 1
          fi
          file=xpack-15.2.1-1.1-corresponding-source.tar.gz
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --output "$file" "$SOURCE_URL"
          echo "$SOURCE_SHA256  $file" | sha256sum --check
          tar -tzf "$file" > /dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.available == 'true'
        with:
          name: xpack-compiler-corresponding-source
          path: xpack-15.2.1-1.1-corresponding-source.tar.gz
          compression-level: 0
          if-no-files-found: error

  toolchain-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Arm's toolchain source package against Arm's published SHA-256
        shell: bash
        run: |
          set -euo pipefail
          read -r name url sha256 < <(python3 packaging/build_app.py --print-toolchain-source)
          fetch() { curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --silent --show-error "$@"; }
          read -r published published_name < <(fetch "$url.sha256asc")
          if [[ "$published" != "$sha256" || "${published_name#\*}" != "$name" ]]; then
            echo "::error::Arm publishes $published for $published_name; packaging/build_app.py pins $sha256 for $name"
            exit 1
          fi
          echo "Arm's published SHA-256 for $name matches the pin."
          if [[ "$GITHUB_REF" == refs/tags/app-v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            fetch --output "$name" "$url"
            echo "$sha256  $name" | sha256sum --check
            ls -l "$name"
            echo "SOURCE_NAME=$name" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/app-v')
        with:
          name: arm-toolchain-source
          path: ${{ env.SOURCE_NAME }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  app:
    needs: compiler-source
    name: app (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            os: macos
            arch: arm64
            machine: arm64
          - runner: macos-15-intel # GitHub's last x86_64 macOS image (announced until fall 2027)
            os: macos
            arch: x86_64
            machine: x86_64
          - runner: windows-latest
            os: windows
            arch: x64
            machine: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: test "app-v$(python packaging/build_app.py --print-version)" = "$GITHUB_REF_NAME"
      - name: Check the architecture and Tkinter
        run: |
          test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
          python -c 'import tkinter; print("Tk", tkinter.TkVersion)'
      - name: Install PyInstaller
        run: python -m pip install -r packaging/requirements.txt
      - name: Build the app, package it and run its self-test
        run: python packaging/build_app.py --self-test
      - name: Point installer recipients to the matching compiler sources
        if: needs.compiler-source.outputs.available == 'true'
        env:
          SOURCE_URL: ${{ vars.XPACK_15_2_1_1_1_SOURCE_URL }}
          SOURCE_SHA256: ${{ vars.XPACK_15_2_1_1_1_SOURCE_SHA256 }}
        run: |
          {
            echo "xPack GNU Arm Embedded GCC 15.2.1-1.1 source code and build scripts"
            echo "$SOURCE_URL"
            echo "SHA-256: $SOURCE_SHA256"
            echo "Also available in this run's xpack-compiler-corresponding-source artifact."
            read -r name url sha256 < <(python packaging/build_app.py --print-toolchain-source)
            echo
            echo "Arm GNU Toolchain 15.2.Rel1 source package: $name"
            echo "$url"
            echo "SHA-256: $sha256 (attached to app-v releases)"
          } > build/desktop-app/COMPILER-SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: needs.compiler-source.outputs.available == 'true'
        with:
          compression-level: 0
          name: R5-Mod-Assistant-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/desktop-app/*.dmg
            build/desktop-app/*.zip
            build/desktop-app/COMPILER-SOURCE.txt
          if-no-files-found: error

  prerelease:
    needs: [app, toolchain-source]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the packages as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum ./*.dmg ./*.zip ./*.tar.gz ./*.tar.xz > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          Unsigned desktop build of R5 Mod Assistant (prototype, untested). macOS: the `arm64` .dmg for Apple Silicon, `x86_64` for Intel Macs. Windows: the `windows-x64` .zip.

          The app is not signed. On macOS, click **Open Anyway** in System Settings > Privacy & Security after the first try (macOS 14 and earlier: Control-click > **Open**). On Windows, extract the whole .zip, and if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**. See [docs/gui.md](https://github.com/WhiteAvocad0/canon-r5-mod/blob/main/docs/gui.md#download-the-app).

          **Bundled compiler:** xPack GNU Arm Embedded GCC 15.2.1-1.1 (GCC 15.2.1, Binutils 2.45, Newlib 4.5.0, GDB 16.3), unmodified: every file of xPack's official archive for each host is included byte for byte, and the app adds only licence notices. xPack builds it from Arm GNU Toolchain 15.2.Rel1 sources. Step 5 checks it automatically. GCC, Binutils and GDB are licensed under the GNU GPL version 3 or later, with the GCC Runtime Library Exception for the runtime libraries; each component's licence is in the package's `Licenses/GNU Arm toolchain` folder and inside the app.

          **Source code:** `arm-gnu-toolchain-src-snapshot-15.2.rel1.tar.xz` below is Arm's source package for 15.2.Rel1 (checked against the SHA-256 Arm publishes). `xpack-15.2.1-1.1-corresponding-source.tar.gz` holds xPack's build scripts, patches and the other source inputs.

          Supply your own camera’s ROM dump. Preparing a card's boot markers is offered on macOS only; on Windows, copy `autoexec.bin` to a card prepared on a Mac. Every build the app makes is a public repackaged build and is hardware-untested.
          EOF
          gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.zip ./*.tar.gz ./*.tar.xz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --prerelease \
            --verify-tag --title "R5 Mod Assistant ${GITHUB_REF_NAME#app-v} for macOS and Windows (unsigned prerelease)" --notes-file notes.md
