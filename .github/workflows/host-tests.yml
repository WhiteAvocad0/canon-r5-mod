name: host-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    name: host-tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Host compiler
        run: cc --version
      - name: Run host tests (no ROM, no ARM toolchain)
        run: python -m unittest discover -s tests -v
